name: CI & Dual-Platform Release Build

on:
  push:
    branches: [main, staging, "feat/**", "fix/**", "audit/**", "chore/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile-check Trackpad module on macOS
        if: runner.os == 'macOS'
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 -dynamiclib -O2 -Wall -Wextra -fobjc-arc -framework Cocoa -framework Carbon -framework CoreGraphics -framework OpenGL -install_name "@executable_path/libsims2_trackpad.dylib" -o /tmp/libsims2_trackpad_ci.dylib trackpad_mod/sims2_trackpad.m
          codesign --force --sign - /tmp/libsims2_trackpad_ci.dylib
          codesign --verify --strict /tmp/libsims2_trackpad_ci.dylib

      - name: Run QA verification & cross-platform tests
        run: python scripts/verify_and_package.py

  package:
    name: Build Release Archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Package Mac & Windows ZIPs
        run: |
          RAW_VER="${GITHUB_REF_NAME:-dev}"
          SAFE_VER="${RAW_VER//\//-}"
          python scripts/verify_and_package.py --package --version "$SAFE_VER"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sims2-crash-patch-archives
          path: dist/*.zip

      - name: Attach archives to GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
